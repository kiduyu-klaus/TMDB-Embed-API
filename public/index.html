<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>KiduyuTvProviders</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="icon" href="./favicon.ico" type="image/x-icon" />
	<link rel="icon" href="./assets/favicon.png" type="image/png" />
	<link rel="apple-touch-icon" href="./assets/kiduyutv-providers-icon.png" />
	<link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./material.css" />
	<script defer src="./login.js"></script>
</head>
<body class="login-page">
	<div class="login-card" id="loginCard">
		<div id="lockoutBanner" style="display:none; background:#7f1d1d; color:#fca5a5; padding:.6rem .75rem; border-radius:8px; font-size:.8rem; line-height:1.2; margin-bottom:1rem;">
			<strong>Too Many Attempts.</strong> Try again in <span id="lockoutCountdown">00:00</span>.
		</div>
		<div class="login-brand"><img class="brand-logo" src="./assets/kiduyutv-providers-icon.png" width="44" height="44" alt="" /><div class="brand-text"><span class="brand-name">KiduyuTv</span><span class="brand-subtitle">Providers</span></div></div>
    <h1>Welcome back</h1>
    <p class="login-description">Sign in to manage your streaming providers.</p>
		<form id="loginForm" autocomplete="on">
			<div class="field">
				<label for="username">Username</label>
				<input id="username" name="username" type="text" autocomplete="username" required autofocus />
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required />
			</div>
			<div class="actions">
				<button id="loginBtn" class="primary" type="submit">Sign in</button>
				<div class="status" id="status" aria-live="polite"></div>
			</div>
		</form>
	</div>
</body>
</html>
